name: Check
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --exclude notepad-web
      - run: cargo clippy --locked -p notepad-server -p notepad-core -p notepad-storage -- -D warnings
      - run: cargo check --locked -p notepad-web --target wasm32-unknown-unknown
  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo install --locked trunk --version 0.21.14
      - run: NO_COLOR=true trunk build --release
      - run: cargo check --locked --manifest-path crates/desktop/Cargo.toml
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg CARGO_BUILD_JOBS=2 -t notepad:ci .
