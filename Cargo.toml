[workspace]
members = ["crates/core", "crates/server", "crates/web", "crates/storage"]
exclude = ["crates/desktop"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
notepad-core = { path = "crates/core" }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
